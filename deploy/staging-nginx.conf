# deploy/staging-nginx.conf — OPS-002 staging HTTPS termination (reference config).
#
# The Node backend (apps/backend) listens on loopback 127.0.0.1:3000 with TRUST_PROXY=true.
# This reverse proxy terminates TLS and is the ONLY thing exposed publicly.
# Not auto-applied by the repo; deployed to the staging host's nginx by OPS.
#
# Obtain certs via certbot/Let's Encrypt or an internal CA; never commit private keys.

# Redirect all plaintext HTTP to HTTPS.
server {
    listen 80;
    server_name staging.everyday.example;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name staging.everyday.example;

    # TLS material is provisioned on the host; keys are NOT in the repo.
    ssl_certificate     /etc/letsencrypt/live/staging.everyday.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.everyday.example/privkey.pem;

    # Modern, safe defaults.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:EveryDayTLS:10m;

    # HSTS: enforce HTTPS for 6 months (only enable once certs are stable).
    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;

    # Bound request body to the backend's own limit (64 KiB) to shed abuse early.
    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # The backend trusts these ONLY because TRUST_PROXY=true and it is not
        # otherwise reachable. Set the real client IP for rate limiting.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Never forward a client-supplied X-Request-Id blindly beyond the app;
        # the backend generates its own request id.
        proxy_read_timeout 30s;
    }
}
