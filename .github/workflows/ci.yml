name: Foundation CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  foundation:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node --import tsx --test scripts/foundation-smoke.mjs
      - run: npm run db:migrate
      - run: npm exec -w @everyday/mobile -- expo install --check
      - run: npm run build:mobile
        env:
          CI: '1'
