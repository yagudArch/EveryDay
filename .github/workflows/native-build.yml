# OPS-001 — native Android/iOS builds on GitHub-hosted runners.
#
# Foundation CI (ci.yml) only proves Metro bundling. Per ARCHITECTURE (Metro export != APK/IPA),
# real native artifacts require native toolchains that are NOT available on the local Windows host,
# so they run here on GitHub-hosted runners:
#   - Android debug APK: ubuntu-latest + JDK 17 + Android SDK.
#   - iOS simulator build: macos-latest + Xcode.
#
# Managed Expo: apps/mobile/android and apps/mobile/ios are git-ignored and generated by
# `expo prebuild`. The device/emulator behavioural gate (cold-launch, no microphone activation,
# SecureStore persistence, login/logout/restart) is scaffolded in the android-device job below;
# see scripts/native/device-checklist.md for exactly what the automated flow does and does not prove.
#
# Manual trigger by default so it does not run on every push; enable push/PR when runners are approved.
name: Native Build
on:
  workflow_dispatch:
  # OPS-001: run on pushes that touch the native build so the fix is actually exercised
  # (workflow_dispatch is unavailable without a token). Scoped by paths to avoid running
  # this heavy job on unrelated commits.
  push:
    paths:
      - '.github/workflows/native-build.yml'
      - 'apps/mobile/**'
      - 'scripts/native/**'

permissions:
  contents: read

jobs:
  android:
    name: Android debug APK (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest ships the Android SDK preinstalled (ANDROID_HOME/ANDROID_SDK_ROOT set).
      # The previous `android-actions/setup-android@v3` step failed here (~24s) and blocked the
      # whole Android job; use the preinstalled SDK directly and just accept licenses.
      - name: Verify Android SDK and accept licenses
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          test -n "$ANDROID_HOME" || { echo 'ANDROID_HOME is not set on the runner'; exit 1; }
          yes | "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true

      # Install the whole workspace so @everyday/contracts is linked for the mobile app.
      - run: npm ci

      # Generate the native android/ project from the managed Expo config.
      - run: npx expo prebuild -p android --no-install
        working-directory: apps/mobile

      - name: Gradle assembleDebug
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: everyday-android-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  android-device:
    name: Android device gate (emulator)
    runs-on: ubuntu-latest
    needs: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - run: npm ci

      - name: Download APK from build job
        uses: actions/download-artifact@v4
        with:
          name: everyday-android-debug-apk
          path: apps/mobile/android-apk

      # Boot an emulator and run the behavioural device checklist. The reusable action
      # provides KVM-accelerated AVDs on ubuntu-latest.
      - name: Cold launch + permission + persistence checks on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          script: node scripts/native/android-device-check.mjs apps/mobile/android-apk

      - name: Upload device-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: everyday-android-device-report
          path: apps/mobile/android-apk/device-check-report.json
          if-no-files-found: warn
          retention-days: 14

  ios:
    name: iOS simulator build (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - run: npm ci

      - name: Select Xcode
        run: sudo xcode-select -p && xcodebuild -version

      - name: Expo prebuild (ios)
        working-directory: apps/mobile
        run: npx expo prebuild -p ios --no-install

      - name: CocoaPods install
        working-directory: apps/mobile/ios
        run: pod install

      # Build for the simulator SDK (no code signing needed for a simulator build).
      - name: xcodebuild simulator build
        working-directory: apps/mobile/ios
        run: |
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package .app artifact
        working-directory: apps/mobile/ios
        run: |
          APP=$(find build/Build/Products -maxdepth 2 -name '*.app' | head -1)
          test -n "$APP" || { echo 'no .app produced'; exit 1; }
          tar -czf everyday-ios-sim.app.tar.gz -C "$(dirname "$APP")" "$(basename "$APP")"

      - name: Upload iOS simulator app artifact
        uses: actions/upload-artifact@v4
        with:
          name: everyday-ios-simulator-app
          path: apps/mobile/ios/everyday-ios-sim.app.tar.gz
          if-no-files-found: error
          retention-days: 14
